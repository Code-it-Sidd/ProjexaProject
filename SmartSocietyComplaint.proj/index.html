<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login - Community Portal</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>

  <!-- Top Navigation Bar -->
  <header>
    <nav class="main-nav">
      <a href="index.html" class="brand-logo">PortalLogo</a>
      <ul class="nav-links">
        <li><a href="index.html" class="active">Login</a></li>
        <li><a href="dashboard.html">Dashboard</a></li>
        <li><a href="admin.html" class="admin-link">Admin</a></li>
      </ul>
    </nav>
  </header>

  <main class="container">
    <div class="card">
      <h1 class="card-title">Login</h1>
      
      <!-- Login Form matching Page 1 sketch -->
      <form action="dashboard.html" method="get">
        <div class="form-group">
          <label for="name">Name</label>
          <input type="text" id="name" name="name" class="form-control" placeholder="Enter your full name" required>
        </div>

        <div class="form-group">
          <label for="phone">Phone no.</label>
          <input type="tel" id="phone" name="phone" class="form-control" placeholder="Enter your phone number" required>
        </div>

        <div class="form-group">
          <label for="address">Address</label>
          <textarea id="address" name="address" class="form-control" rows="3" placeholder="Flat / House Number, Street" required></textarea>
        </div>

        <button type="submit" class="btn">Continue</button>
      </form>
    </div>
  </main>

</body>
</html>
