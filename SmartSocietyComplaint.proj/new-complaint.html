<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>New Complaint - Portal</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>

  <header>
    <nav class="main-nav">
      <a href="dashboard.html" class="brand-logo">PortalLogo</a>
      <ul class="nav-links">
        <li><a href="dashboard.html">Dashboard</a></li>
        <li><a href="new-complaint.html" class="active">New Complaint</a></li>
        <li><a href="complaints.html">Your Complaints</a></li>
        <li><a href="services.html">Services</a></li>
        <li><a href="admin.html" class="admin-link">Admin</a></li>
      </ul>
    </nav>
  </header>

  <main class="container">
    <div class="card">
      <h1 class="card-title">New Complaint</h1>
      
      <form action="complaints.html" method="get">
        <!-- Complaint Categories matching sketch -->
        <fieldset class="form-group" style="border:none;">
          <legend style="font-weight: 600; margin-bottom: 0.5rem;">Complaint Details</legend>
          <div class="option-list">
            <label class="option-item">
              <input type="radio" name="complaint_type" value="plumbing" checked>
              <span>Plumbing</span>
            </label>
            <label class="option-item">
              <input type="radio" name="complaint_type" value="security">
              <span>Security</span>
            </label>
            <label class="option-item">
              <input type="radio" name="complaint_type" value="electricity">
              <span>Electricity</span>
            </label>
            <label class="option-item">
              <input type="radio" name="complaint_type" value="others">
              <span>Others</span>
            </label>
          </div>
        </fieldset>

        <!-- Inline SVG Placeholder for Photo Upload -->
        <div class="form-group">
          <label>Upload Photo</label>
          <div class="file-upload-box">
            <svg width="40" height="40" viewBox="0 0 24 24" fill="none" stroke="#6b7280" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="margin-bottom: 0.5rem;">
              <rect x="3" y="3" width="18" height="18" rx="2" ry="2"/>
              <circle cx="8.5" cy="8.5" r="1.5"/>
              <polyline points="21 15 16 10 5 21"/>
            </svg>
            <p style="font-size: 0.85rem; color: #6b7280;">Click or drag an image here to upload</p>
            <input type="file" style="display: none;" id="file-input">
          </div>
        </div>

        <div class="form-group">
          <label for="house-no">House no:</label>
          <input type="text" id="house-no" name="house_no" class="form-control" placeholder="e.g. Apt 4B" required>
        </div>

        <button type="submit" class="btn">Register complaint</button>
      </form>
    </div>
  </main>

</body>
</html>
